services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    # Host networking keeps device discovery (mDNS, Bluetooth, SSDP) working.
    network_mode: host
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
      # Host audio (PipeWire's PulseAudio socket) and system sounds, used by
      # shell_command.alarme_tocar_som. The directory is mounted (not the socket)
      # so a PipeWire restart does not leave a stale bind mount.
      - /run/user/1000/pulse:/run/pulse
      - /usr/share/sounds:/sounds:ro
      # Notebook photos (also shared on the LAN as \\192.168.3.111\ricardo\Pictures),
      # read-only; config/fotos/sync_photos.py makes resized copies for the photo frame.
      - /home/ricardo/Pictures:/pictures:ro
      # External disk (fstab: UUID=FEDB-7740 on /mnt/hd-externo) with the camera
      # recordings; HA cuts the event clips (config/camera/make_clip.py). The
      # parent folder is shared with rslave so a later mount still shows up.
      - /mnt:/mnt:rslave
    environment:
      - PULSE_SERVER=unix:/run/pulse/native
    # Needed by the Bluetooth integration to manage the adapter over D-Bus.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      # Sonoff Zigbee 3.0 USB Dongle Plus V2, used by the ZHA integration.
      - /dev/serial/by-id/usb-Itead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_V2_686e6746c078f011af23f2eba7772636-if00-port0:/dev/ttyUSB0

  camera-recorder:
    build:
      context: ./camera-recorder
      network: host
    container_name: camera-recorder
    restart: unless-stopped
    # Host networking reaches the camera on the LAN like any other device.
    network_mode: host
    volumes:
      - /mnt:/mnt:rslave
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=America/Sao_Paulo
      - CAMERA_RTSP_URL=${CAMERA_RTSP_URL:-}
      - BASE_DIR=/mnt/hd-externo/cameras
      - MAX_USAGE_PERCENT=95

  camera-vps-stream:
    image: home-assistant-camera-recorder
    container_name: camera-vps-stream
    restart: unless-stopped
    network_mode: host
    environment:
      - CAMERA_RTSP_URL=${CAMERA_RTSP_URL:-}
      - VPS_RTSP_PUSH_URL=${VPS_RTSP_PUSH_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -z "$$VPS_RTSP_PUSH_URL" ]; then
          echo "VPS_RTSP_PUSH_URL not set; stream to VPS disabled.";
          sleep infinity;
        fi;
        while true; do
          ffmpeg -hide_banner -loglevel warning -rtsp_transport tcp -i "$$CAMERA_RTSP_URL" -c copy -f rtsp "$$VPS_RTSP_PUSH_URL" || true;
          sleep 5;
        done

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    # Only starts when COMPOSE_PROFILES includes "tunnel" (see .env.example).
    profiles: ["tunnel"]
    # Host networking lets the tunnel reach Home Assistant at localhost:9999.
    network_mode: host
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    depends_on:
      - homeassistant
