alarme_som_pessoa:
  alias: Tocar som de pessoa
  description: Toca no notebook o som escolhido em "Som de pessoa" (2 vezes).
  icon: mdi:human-handsdown
  mode: single
  sequence:
  - variables:
      files:
        Ding-dong: /config/sounds/ding-dong.wav
        Mensagem: /sounds/freedesktop/stereo/message-new-instant.oga
        Login: /sounds/freedesktop/stereo/service-login.oga
        Despertador: /sounds/freedesktop/stereo/alarm-clock-elapsed.oga
  - action: shell_command.alarme_tocar_som
    data:
      file: '{{ files.get(states(''input_select.alarme_som_pessoa''), files[''Ding-dong''])
        }}'
      volume: 0.6
      loops: 1
alarme_som_animal:
  alias: Tocar som de animal
  description: Toca no notebook o sino baixo usado para "possível animalzinho".
  icon: mdi:cat
  mode: single
  sequence:
  - action: shell_command.alarme_tocar_som
    data:
      file: /sounds/freedesktop/stereo/bell.oga
      volume: 2.0
campainha_tocar:
  alias: Tocar campainha
  description: Toca o ding-dong no notebook 2 vezes seguidas (campainha).
  icon: mdi:doorbell
  mode: queued
  max: 10
  sequence:
  # Both rings in one ffmpeg call (loops: 1), so they are never cut or
  # overlapped; the script ends only after the sound has finished.
  - action: shell_command.alarme_tocar_som
    data:
      file: /config/sounds/ding-dong.wav
      volume: 1.0
      loops: 1
