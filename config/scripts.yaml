alarme_som_pessoa:
  alias: Tocar som de pessoa
  description: Toca no notebook o som escolhido em "Som de pessoa" (2 vezes).
  icon: mdi:human-handsdown
  mode: single
  sequence:
  - variables:
      files:
        Ding-dong: /config/sounds/ding-dong.wav
        Mensagem: /sounds/freedesktop/stereo/message-new-instant.oga
        Login: /sounds/freedesktop/stereo/service-login.oga
        Despertador: /sounds/freedesktop/stereo/alarm-clock-elapsed.oga
  - action: shell_command.alarme_tocar_som
    data:
      file: '{{ files.get(states(''input_select.alarme_som_pessoa''), files[''Ding-dong''])
        }}'
      volume: 0.6
      loops: 1
alarme_som_animal:
  alias: Tocar som de animal
  description: Toca no notebook o sino baixo usado para "possível animalzinho".
  icon: mdi:cat
  mode: single
  sequence:
  - action: shell_command.alarme_tocar_som
    data:
      file: /sounds/freedesktop/stereo/bell.oga
      volume: 2.0
campainha_tocar:
  alias: Tocar campainha
  description: Toca o ding-dong no notebook 2 vezes seguidas (campainha).
  icon: mdi:doorbell
  mode: queued
  max: 10
  sequence:
  # Both rings in one ffmpeg call (loops: 1), so they are never cut or
  # overlapped; the script ends only after the sound has finished.
  - action: shell_command.alarme_tocar_som
    data:
      file: /config/sounds/ding-dong.wav
      volume: 1.8
      loops: 1
campainha_luz_1min:
  alias: Campainha - luz do corredor por 1 minuto
  description: Liga a lampada corredor e desliga depois de 1 minuto. Chamado de novo,
    recomeça a contagem (mode restart). Não desliga se o alarme estiver disparado.
  icon: mdi:lightbulb-on
  mode: restart
  sequence:
  - action: switch.turn_on
    target:
      entity_id: switch.lampada_corredor_socket_1
  - delay:
      minutes: 1
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarme_casa
      state: triggered
  - action: switch.turn_off
    target:
      entity_id: switch.lampada_corredor_socket_1
luz_corredor_10min:
  alias: Frente da casa - luz do corredor por 10 minutos
  description: Liga a lampada corredor e desliga depois de 10 minutos. Chamado de
    novo, recomeça a contagem (mode restart). Não desliga se o alarme estiver disparado.
  icon: mdi:lightbulb-on
  mode: restart
  sequence:
  - action: switch.turn_on
    target:
      entity_id: switch.lampada_corredor_socket_1
  - delay:
      minutes: 10
  - condition: not
    conditions:
    - condition: state
      entity_id: alarm_control_panel.alarme_casa
      state: triggered
  - action: switch.turn_off
    target:
      entity_id: switch.lampada_corredor_socket_1
alarme_exportar_registro:
  alias: Gerar download do registro do alarme
  description: Gera um CSV com os eventos do alarme armado entre "Download - início"
    e "Download - fim" e mostra o link no painel (e no celular). O link expira em
    24 h.
  icon: mdi:file-download
  mode: single
  sequence:
  - action: shell_command.alarme_log_export
    data:
      start: '{{ states(''input_datetime.alarme_export_inicio'') }}'
      end: '{{ states(''input_datetime.alarme_export_fim'') }}'
    response_variable: result
  - variables:
      path: '{{ result.stdout.split(''|'')[0] }}'
      rows: '{{ result.stdout.split(''|'')[1] | default(0) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.alarme_ultimo_export
    data:
      value: '{{ result.stdout }}'
  - action: notify.mobile_app_android_ricardo
    data:
      title: ⬇️ Registro do alarme pronto
      message: '{{ rows }} evento(s) de {{ states(''input_datetime.alarme_export_inicio'')[:16]
        }} a {{ states(''input_datetime.alarme_export_fim'')[:16] }}. Toque para baixar
        (expira em 24 h).'
      data:
        clickAction: '{{ path }}'
