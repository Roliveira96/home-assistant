  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: clock
      clock_size: large
      show_seconds: false
      grid_options:
        columns: full
        rows: 2
    - type: markdown
      content: |
        {%- set dias = ['Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado', 'Domingo'] %}
        {%- set meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'] %}
        <center><b>{{ dias[now().weekday()] }}, {{ now().day }} de {{ meses[now().month - 1] }}</b></center>
      grid_options:
        columns: full
        rows: 1
