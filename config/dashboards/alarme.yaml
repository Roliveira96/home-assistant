    # Card de Aviso da Qualidade do Ar
    - type: markdown
      title: 🍃 Qualidade do Ar & Conforto
      grid_options:
        columns: full
      content: |
        {% set u1 = states('sensor.escritorio_medidor_de_temperatura_e_umidade_umidade') | float(0) %}
        {% set t1 = states('sensor.escritorio_medidor_de_temperatura_e_umidade_temperatura') | float(0) %}
        {% set q1 = states('sensor.qualidade_do_ar_escritorio_1') %}
        {% set u2 = states('sensor.escritorio_medidor_de_temperatura_umidade') | float(0) %}
        {% set t2 = states('sensor.escritorio_medidor_de_temperatura_temperatura') | float(0) %}
        {% set q2 = states('sensor.qualidade_do_ar_escritorio_2') %}
        {% set u3 = states('sensor.area_externa_sensor_de_passagem_novo_umidade') | float(0) %}
        {% set t3 = states('sensor.area_externa_sensor_de_passagem_novo_temperatura') | float(0) %}
        {% set q3 = states('sensor.qualidade_do_ar_area_externa') %}

        {% macro badge_ar(status) -%}
          {%- if status == 'Boa' -%}
            🟢 **Boa** (Ideal: 40-60%)
          {%- elif status == 'Média' -%}
            🟡 **Média** (Atenção)
          {%- else -%}
            🔴 **Ruim** (Alerta)
          {%- endif -%}
        {%- endmacro %}

        | Sensor / Ambiente | Temperatura | Umidade | Qualidade do Ar |
        | :--- | :---: | :---: | :--- |
        | 🏢 **Escritório 1** | {{ t1 }} °C | {{ u1 }}% | {{ badge_ar(q1) }} |
        | 💻 **Escritório 2** | {{ t2 }} °C | {{ u2 }}% | {{ badge_ar(q2) }} |
        | 🌳 **Área Externa** | {{ t3 }} °C | {{ u3 }}% | {{ badge_ar(q3) }} |

        {% if u1 > 70 or u2 > 70 or u3 > 75 %}
        ⚠️ **Aviso de Umidade Alta:** Níveis acima de 70% favorecem proliferação de ácaros e mofo. Abra janelas quando a umidade externa estiver menor.
        {% elif u1 < 30 or u2 < 30 %}
        ⚠️ **Aviso de Ar Seco:** Umidade abaixo de 30% causa ressecamento respiratório. Recomenda-se ligar o umidificador.
        {% else %}
        ✨ **Ar Confortável:** Parâmetros de temperatura e umidade dentro da faixa recomendada de bem-estar.
        {% endif %}

    # Medidores - Escritório 1
    - type: heading
      heading: Escritório 1
      icon: mdi:desk
      grid_options:
        columns: full
    - type: gauge
      entity: sensor.escritorio_medidor_de_temperatura_e_umidade_temperatura
