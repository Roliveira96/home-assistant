  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Registro do alarme armado
      icon: mdi:shield-alert
    - type: markdown
      grid_options:
        columns: full
      content: |
        {%- set ev = (state_attr('sensor.registro_do_alarme_armado', 'eventos') or [])[:50] %}
        {%- if not ev %}
        Nenhum evento com o alarme armado ainda.
        {%- else %}
        {%- set h = ev | selectattr('tipo', 'eq', 'humano') | list | count %}
        <ha-alert alert-type="info">Últimos <b>{{ ev | count }}</b> eventos · 🧍 <b>{{ h }}</b> possível humano · 🐈 <b>{{ ev | count - h }}</b> possível animalzinho</ha-alert>
        {%- set today = now().strftime('%d/%m') %}
        {%- set yesterday = (now() - timedelta(days=1)).strftime('%d/%m') %}
        {%- for day in ev | map(attribute='hora') | map('truncate', 5, true, '') | unique %}
        {%- set items = ev | selectattr('hora', 'search', '^' ~ day) | list %}
        {%- set hd = items | selectattr('tipo', 'eq', 'humano') | list | count %}
        {#- Merge consecutive events with the same type and sensors. #}
        {%- set ns = namespace(groups=[], cur=none) %}
        {%- for e in items %}
        {%- if ns.cur and ns.cur.tipo == e.tipo and ns.cur.sensores == e.sensores %}
        {%- set ns.cur = dict(ns.cur, first=e.hora[6:11], n=ns.cur.n + 1) %}
        {%- else %}
        {%- if ns.cur %}{% set ns.groups = ns.groups + [ns.cur] %}{% endif %}
        {%- set ns.cur = {'tipo': e.tipo, 'sensores': e.sensores, 'last': e.hora[6:11], 'first': e.hora[6:11], 'n': 1} %}
        {%- endif %}
        {%- endfor %}
        {%- set ns.groups = ns.groups + [ns.cur] %}
        <details{{ ' open' if loop.first }}><summary><b>📅 {{ 'Hoje' if day == today else ('Ontem' if day == yesterday else day) }}</b> — {{ items | count }} evento(s){{ ' · 🧍 ' ~ hd if hd }}</summary>
        <table width="100%">
        <tr><th></th><th align="left">Hora</th><th align="left">Sensores</th><th align="right">Vezes</th></tr>
        {%- for g in ns.groups %}
        <tr><td>{{ '🧍' if g.tipo == 'humano' else '🐈' }}</td><td>{{ g.last if g.n == 1 else g.first ~ '–' ~ g.last }}</td><td>{{ '<b>' ~ g.sensores ~ '</b>' if g.tipo == 'humano' else g.sensores }}</td><td align="right">{{ '×' ~ g.n if g.n > 1 else '' }}</td></tr>
        {%- endfor %}
        </table>
        </details>
        {%- endfor %}
        {%- endif %}
