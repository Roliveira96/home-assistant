- id: '1792500000001'
  alias: Teste - temperatura abaixo de 19.4
  description: Notifica o celular quando um medidor de temperatura do escritório
    fica abaixo de 19.4 °C (automação de teste).
  triggers:
  - trigger: numeric_state
    entity_id:
    - sensor.escritorio_medidor_de_temperatura_e_umidade_temperatura
    - sensor.escritorio_medidor_de_temperatura_temperatura
    below: 19.4
  conditions:
  # Quiet hours (00:00-07:30).
  - condition: time
    after: 07:30:00
    before: '23:59:59'
  actions:
  - action: notify.mobile_app_android_ricardo
    data:
      title: Temperatura baixa
      message: '{{ trigger.to_state.name }}: {{ trigger.to_state.state }} °C (abaixo
        de 19.4 °C)'
  mode: queued
- id: '1792500000002'
  alias: Aviso - Zigbee indisponível
  description: Notifica o celular quando dispositivos Zigbee ficam indisponíveis
    por 30 min, lembra todo dia às 9h e avisa quando todos voltarem.
  triggers:
  - trigger: state
    entity_id: sensor.zigbee_indisponiveis
    for:
      minutes: 30
    id: changed
  - trigger: time
    at: 09:00:00
    id: daily
  conditions: []
  actions:
  - variables:
      count: '{{ states(''sensor.zigbee_indisponiveis'') | int(0) }}'
      previous: '{{ trigger.from_state.state | int(0) if trigger.id == ''changed''
        else 0 }}'
      names: '{{ state_attr(''sensor.zigbee_indisponiveis'', ''devices'') | default([],
        true) | join('', '') }}'
  - condition: template
    # Quiet hours: changes during the night wait for the 09:00 reminder.
    value_template: '{{ trigger.id == ''daily'' or not (now().hour < 7 or (now().hour
      == 7 and now().minute < 30)) }}'
  - choose:
    # More devices went offline (or daily reminder while any is offline).
    - conditions:
      - condition: template
        value_template: '{{ count > 0 and (trigger.id == ''daily'' or count > previous)
          }}'
      sequence:
      - action: notify.mobile_app_android_ricardo
        data:
          title: Zigbee indisponível
          message: '{{ count }} dispositivo(s) fora do ar: {{ names }}'
    # Everything is back online.
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''changed'' and count == 0 and previous
          > 0 }}'
      sequence:
      - action: notify.mobile_app_android_ricardo
        data:
          title: Zigbee normalizado
          message: Todos os dispositivos Zigbee voltaram a funcionar.
  mode: queued
- id: '1792500000004'
  alias: Alarme - classificar movimento (humano ou animal)
  description: 'Classifica cada detecção do Sensor de passagem novo, Lateral casa
    e Fundos Casa. Possível humano: 2 sensores diferentes dentro da janela de confirmação,
    ou o mesmo sensor detectando direto pelo tempo de presença. Senão, possível
    animalzinho. Só registra (contadores, logbook e registro do alarme armado):
    esses sensores pegam os gatos, então não disparam o alarme, não ligam a luz,
    não notificam e não tocam som. Quem dispara é o Sensor Frente da Casa.'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.area_externa_sensor_de_passagem_novo
    - binary_sensor.lateral_casa
    - binary_sensor.fundos_casa
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - variables:
      first: '{{ trigger.entity_id }}'
      others: "{{ ['binary_sensor.area_externa_sensor_de_passagem_novo', 'binary_sensor.lateral_casa',\
        \ 'binary_sensor.fundos_casa'] | reject('eq', trigger.entity_id) | list }}"
      radar: binary_sensor.area_externa_sensor_de_passagem_novo
      radar_ok: '{{ is_state(''input_boolean.alarme_radar_confirma'', ''on'') }}'
      # Sensors allowed to confirm a human (the radar only when trusted).
      confirmers: "{{ others if is_state('input_boolean.alarme_radar_confirma', 'on')\
        \ else others | reject('eq', 'binary_sensor.area_externa_sensor_de_passagem_novo')\
        \ | list }}"
      window_min: '{{ states(''input_number.alarme_janela_confirmacao'') | int(2) }}'
      persist_s: '{{ states(''input_number.alarme_tempo_presenca'') | int(60) }}'
      armed: '{{ states(''alarm_control_panel.alarme_casa'') in [''armed_away'', ''armed_home'',
        ''armed_night'', ''armed_vacation'', ''triggered''] }}'
      # Template binary sensors that stay on for the confirmation window.
      recent:
        binary_sensor.area_externa_sensor_de_passagem_novo: binary_sensor.deteccao_recente_sensor_de_passagem
        binary_sensor.lateral_casa: binary_sensor.deteccao_recente_lateral_casa
        binary_sensor.fundos_casa: binary_sensor.deteccao_recente_fundos_casa
      # Another sensor detected now or within the confirmation window.
      human_now: >
        {% set ns = namespace(hit=false) %}
        {% for e in confirmers if is_state(recent[e], 'on') %}{% set ns.hit = true %}{% endfor %}
        {{ ns.hit }}
  # Phase 1: does the same sensor keep detecting for the presence time?
  # (completes at once when already confirmed; times out if it stays on).
  - wait_template: '{{ human_now or is_state(first, ''off'') or confirmers | select(''is_state'',
      ''on'') | list | count > 0 }}'
    timeout:
      seconds: '{{ persist_s }}'
    continue_on_timeout: true
  - variables:
      # Continuous presence only counts for the radar when it is trusted.
      phase1_human: '{{ human_now or (not wait.completed and (first != radar or radar_ok))
        or confirmers | select(''is_state'', ''on'') | list | count > 0 }}'
  # Phase 2: does another sensor detect within the confirmation window?
  - wait_template: '{{ phase1_human or confirmers | select(''is_state'', ''on'') |
      list | count > 0 }}'
    timeout:
      minutes: '{{ window_min }}'
    continue_on_timeout: true
  - variables:
      is_human: '{{ phase1_human or wait.completed }}'
      partners: >
        {% set ns = namespace(names=[]) %}
        {% for e in confirmers if is_state(recent[e], 'on') %}
          {% set ns.names = ns.names + [state_attr(e, 'friendly_name')] %}
        {% endfor %}
        {{ ns.names }}
      where: '{{ ([state_attr(first, ''friendly_name'')] + partners) | join('' + '') }}'
  # Consumed by the "Registro do alarme armado" sensor (and, later, by the
  # camera snapshot automation).
  - event: alarme_evento
    event_data:
      tipo: '{{ ''humano'' if is_human else ''animal'' }}'
      sensores: '{{ where }}'
      armado: '{{ armed }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_human }}'
      sequence:
      - action: counter.increment
        target:
          entity_id: counter.eventos_possivel_humano
      - action: logbook.log
        data:
          name: Possível humano
          message: '{{ where }}{{ '' (alarme armado)'' if armed else '''' }}'
          entity_id: counter.eventos_possivel_humano
    default:
    - action: counter.increment
      target:
        entity_id: counter.eventos_possivel_animal
    - action: logbook.log
      data:
        name: Possível animalzinho
        message: '{{ where }}{{ '' (alarme armado)'' if armed else '''' }}'
        entity_id: counter.eventos_possivel_animal
  mode: single
  max_exceeded: silent
- id: '1792500000005'
  alias: Alarme - zerar contadores à meia-noite
  description: Zera os contadores de possível humano, possível animalzinho e campainha
    todo dia.
  triggers:
  - trigger: time
    at: 00:00:00
  conditions: []
  actions:
  - action: counter.reset
    target:
      entity_id:
      - counter.eventos_possivel_animal
      - counter.eventos_possivel_humano
      - counter.campainha_hoje
  mode: single
- id: '1792500000006'
  alias: Alarme - armar modo noite à meia-noite
  description: Arma o Alarme casa em "noite" às 00:00 se estiver desarmado (pessoas
    em casa; sem som, lâmpada e notificação só para humano).
  triggers:
  - trigger: time
    at: 00:00:00
  conditions:
  - condition: state
    entity_id: alarm_control_panel.alarme_casa
    state: disarmed
  actions:
  - action: alarm_control_panel.alarm_arm_night
    target:
      entity_id: alarm_control_panel.alarme_casa
  mode: single
- id: '1792500000007'
  alias: Alarme - desarmar modo noite às 08:00
  description: Desarma o Alarme casa às 08:00 se ele estiver no modo noite (um "ausente"
    armado manualmente continua armado).
  triggers:
  - trigger: time
    at: 08:00:00
  conditions:
  - condition: template
    value_template: '{{ is_state(''alarm_control_panel.alarme_casa'', ''armed_night'')
      or (is_state(''alarm_control_panel.alarme_casa'', ''triggered'') and state_attr(''alarm_control_panel.alarme_casa'',
      ''previous_state'') == ''armed_night'') }}'
  actions:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.alarme_casa
  mode: single
- id: '1792500000008'
  alias: Campainha - botão
  description: 'Botão Campainha (ZG-101ZL, aparece no ZHA como interruptor: 1 clique
    = toggle, 2 cliques = on, segurar = off). Cada toque: ding-dong 2x, notificação
    e luz do corredor por 1 minuto (recomeça a cada toque; se a luz já estava ligada
    por outro motivo, não mexe).'
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: a4:c1:38:ac:10:ef:c2:02
      command: toggle
    id: single
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: a4:c1:38:ac:10:ef:c2:02
      command: 'on'
    id: double
  conditions: []
  actions:
  - variables:
      # Light already on and not by a previous doorbell press: leave it alone.
      light: '{{ is_state(''switch.lampada_corredor_socket_1'', ''off'') or is_state(''script.campainha_luz_1min'',
        ''on'') }}'
      snap_time: '{{ now().strftime(''%Y-%m-%d_%H-%M-%S'') }}'
      snap_path: /config/media/camera/{{ snap_time }}_campainha.jpg
      snap_url: /media/local/camera/{{ snap_time }}_campainha.jpg
      snap_epoch: '{{ now().timestamp() | int }}'
  - action: camera.snapshot
    target:
      entity_id: camera.camera_corredor_mainstream
    data:
      filename: '{{ snap_path }}'
  - action: script.turn_on
    target:
      entity_id: script.camera_cortar_clipe
    data:
      variables:
        kind: sensores
        label: campainha
        epoch: '{{ snap_epoch }}'
        snapshot: '{{ snap_path }}'
  - if:
    - condition: template
      value_template: '{{ light }}'
    then:
    - action: script.turn_on
      target:
        entity_id: script.campainha_luz_1min
  - action: notify.celulares
    data:
      title: 🔔 Campainha
      message: 'Tocaram a campainha às {{ now().strftime(''%H:%M'') }}{{ '' (luz do corredor
        ligada por 1 min)'' if light else '''' }}.'
      data:
        priority: high
        ttl: 0
        image: '{{ snap_url }}'
  - action: logbook.log
    data:
      name: Campainha
      message: '{{ ''2 cliques'' if trigger.id == ''double'' else ''1 clique'' }}{{ ''
        - luz 1 min'' if light else '''' }}'
      entity_id: script.campainha_tocar
  - action: counter.increment
    target:
      entity_id: counter.campainha_hoje
  # Consumed by the "Última campainha" template sensor.
  - event: campainha_tocou
    event_data:
      tipo: '{{ "2 cliques" if trigger.id == "double" else "1 clique" }}'
      luz: '{{ light }}'
  - action: script.campainha_tocar
  mode: queued
  max: 10
- id: '1792500000009'
  alias: Alarme - gravar registro em arquivo
  description: Grava cada evento classificado com o alarme armado no histórico CSV
    (config/alarme/events.csv), usado pelo download por período.
  triggers:
  - trigger: event
    event_type: alarme_evento
  conditions:
  - condition: template
    value_template: '{{ trigger.event.data.armado | bool(false) }}'
  actions:
  - action: shell_command.alarme_log_append
    data:
      tipo: '{{ trigger.event.data.tipo }}'
      sensores: '{{ trigger.event.data.sensores }}'
  mode: queued
  max: 20
- id: '1792500000010'
  alias: Porta-retrato - trocar foto
  description: A cada 20 s copia outra foto sorteada de media/fotos para config/fotos/current.jpg,
    o arquivo fixo exibido pela câmera camera.porta_retrato (painel Casa).
  triggers:
  - trigger: time_pattern
    seconds: /20
  conditions: []
  actions:
  - action: shell_command.fotos_proxima
  mode: single
  max_exceeded: silent
- id: '1792500000011'
  alias: Porta-retrato - sincronizar fotos do notebook
  description: De hora em hora (e ao iniciar o HA) copia as fotos de ~/Pictures do
    notebook, reduzidas, para media/fotos.
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: time_pattern
    minutes: 5
  conditions: []
  actions:
  - action: shell_command.fotos_sincronizar
    response_variable: result
  - if:
    - condition: template
      value_template: '{{ result.returncode != 0 }}'
    then:
    - action: logbook.log
      data:
        name: Porta-retrato
        message: 'falha ao sincronizar: {{ result.stderr[:200] }}'
  mode: single
- id: '1792500000012'
  alias: Alarme - pessoa real na frente da casa (SNZB-06P)
  description: O Sensor Frente da Casa (SONOFF SNZB-06P, radar de presença humana)
    detecta pessoa com o alarme armado (qualquer modo, inclusive noite) → dispara
    o alarme, notifica os celulares, grava no registro do alarme armado e toca no
    notebook o som de pessoa (se o "Som no notebook" estiver ligado e fora do horário
    silencioso da noite 00:00-08:00). É o único sensor que dispara o alarme.
  triggers:
  - trigger: state
    entity_id: binary_sensor.sensor_frente_da_casa
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: alarm_control_panel.alarme_casa
    state:
    - armed_away
    - armed_home
    - armed_night
    - armed_vacation
    - triggered
  actions:
  - variables:
      snap_time: '{{ now().strftime(''%Y-%m-%d_%H-%M-%S'') }}'
      snap_path: /config/media/camera/{{ snap_time }}_pessoa_frente.jpg
      snap_url: /media/local/camera/{{ snap_time }}_pessoa_frente.jpg
      snap_epoch: '{{ now().timestamp() | int }}'
  - action: camera.snapshot
    target:
      entity_id: camera.camera_corredor_mainstream
    data:
      filename: '{{ snap_path }}'
  - action: script.turn_on
    target:
      entity_id: script.camera_cortar_clipe
    data:
      variables:
        kind: alarme
        label: pessoa_frente
        epoch: '{{ snap_epoch }}'
        snapshot: '{{ snap_path }}'
  # Consumed by the "Registro do alarme armado" sensor and the CSV history.
  - event: alarme_evento
    event_data:
      tipo: humano
      sensores: Sensor Frente da Casa
      armado: true
      foto: '{{ snap_url }}'
  - action: logbook.log
    data:
      name: Pessoa na frente da casa
      message: Sensor Frente da Casa (alarme armado)
      entity_id: binary_sensor.sensor_frente_da_casa
  # alarm_trigger fails when the panel is already triggered.
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: alarm_control_panel.alarme_casa
        state: triggered
    then:
    - action: alarm_control_panel.alarm_trigger
      target:
        entity_id: alarm_control_panel.alarme_casa
  - action: notify.celulares
    data:
      title: 🚨 Alarme disparado - pessoa na frente da casa
      message: Sensor Frente da Casa às {{ now().strftime('%H:%M') }}.
      data:
        priority: high
        ttl: 0
        image: '{{ snap_url }}'
  - if:
    - condition: state
      entity_id: input_boolean.alarme_som_notebook
      state: 'on'
    - condition: template
      value_template: >-
        {{ now().hour >= 8 and not (is_state('alarm_control_panel.alarme_casa', 'armed_night') or state_attr('alarm_control_panel.alarme_casa', 'previous_state') == 'armed_night') }}
    then:
    - action: script.alarme_som_pessoa
  mode: single
  max_exceeded: silent
- id: '1792500000013'
  alias: Corredor - luz à noite por presença/pessoa
  description: Das 18h às 8h, a detecção de pessoa (pelo Sensor Frente da Casa ou pela
    IA de Detecção de Pessoa da Câmera) liga a lâmpada do corredor por 10 minutos (recomeça
    a cada nova passagem), com ou sem alarme. Se a luz já estava ligada por outro motivo, não mexe.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.sensor_frente_da_casa
    - binary_sensor.camera_corredor_person_detection
    from: 'off'
    to: 'on'
  conditions:
  - condition: time
    after: '18:00:00'
    before: '08:00:00'
  - condition: template
    # Light off, or on only because of this timer or the doorbell timer.
    value_template: '{{ is_state(''switch.lampada_corredor_socket_1'', ''off'') or
      is_state(''script.luz_corredor_10min'', ''on'') or is_state(''script.campainha_luz_1min'',
      ''on'') }}'
  actions:
  # Take over from the 1-minute doorbell timer so it does not switch the light
  # off in the middle of these 10 minutes.
  - action: script.turn_off
    target:
      entity_id: script.campainha_luz_1min
  - action: script.turn_on
    target:
      entity_id: script.luz_corredor_10min
  mode: single
  max_exceeded: silent
- id: '1792500000014'
  alias: CFTV - Controle remoto via Webhook
  description: Recebe comandos enviados pela Central CFTV na VPS (Luz, Sirene, Som) protegidos por token.
  triggers:
  - trigger: webhook
    webhook_id: cftv_comando
    allowed_methods:
    - POST
    local_only: false
  conditions:
  - condition: template
    value_template: "{{ trigger.json.token == 'cftv_b9024ac05290e25276ce8ede62fab06f' }}"
  actions:
  - choose:
    # Ação 1: Acender luz do corredor por 10 min
    - conditions:
      - condition: template
        value_template: "{{ trigger.json.action == 'luz' }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.luz_corredor_10min
      - action: logbook.log
        data:
          name: Central CFTV
          message: Luz do corredor acionada remotamente
    # Ação 2: Disparar alarme/sirene
    - conditions:
      - condition: template
        value_template: "{{ trigger.json.action == 'sirene' }}"
      sequence:
      - action: alarm_control_panel.alarm_trigger
        target:
          entity_id: alarm_control_panel.alarme_casa
      - action: logbook.log
        data:
          name: Central CFTV
          message: Sirene de alarme acionada remotamente
    # Ação 3: Tocar ding-dong / som no notebook
    - conditions:
      - condition: template
        value_template: "{{ trigger.json.action == 'som' }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.campainha_tocar
      - action: logbook.log
        data:
          name: Central CFTV
          message: Som de aviso tocado no notebook
  mode: queued
  max: 10
- id: '1792500000015'
  alias: Alerta - alguém próximo ao portão (sensor corredor)
  description: 'Alerta quando o Sensor Corredor Portão detecta alguém próximo: notifica
    o celular com prioridade alta (e foto da câmera se disponível), toca aviso no notebook
    se ativado e, das 18h às 8h, liga a luz do corredor por 1 minuto.'
  triggers:
  - trigger: state
    entity_id: binary_sensor.sensor_corredor_portao
    from: 'off'
    to: 'on'
  conditions: []
  actions:
  - variables:
      snap_time: '{{ now().strftime(''%Y-%m-%d_%H-%M-%S'') }}'
      snap_path: /config/media/camera/{{ snap_time }}_portao.jpg
      snap_url: /media/local/camera/{{ snap_time }}_portao.jpg
  - action: camera.snapshot
    continue_on_error: true
    target:
      entity_id: camera.camera_corredor_mainstream
    data:
      filename: '{{ snap_path }}'
  - action: notify.mobile_app_android_ricardo
    data:
      title: '🚨 Portão: Alguém detectado!'
      message: 'Presença detectada no portão às {{ now().strftime(''%H:%M:%S'') }}{% set lqi = states(''sensor.sensor_corredor_portao_lqi'') %}{% if lqi not in [''unavailable'', ''unknown''] %} · LQI {{ lqi }}{% endif %}.'
      data:
        priority: high
        ttl: 0
        image: '{{ snap_url }}'
  - if:
    - condition: state
      entity_id: input_boolean.alarme_som_notebook
      state: 'on'
    - condition: template
      value_template: >-
        {{ now().hour >= 8 and not (is_state('alarm_control_panel.alarme_casa', 'armed_night') or state_attr('alarm_control_panel.alarme_casa', 'previous_state') == 'armed_night') }}
    then:
    - action: script.alarme_som_pessoa
  - if:
    - condition: time
      after: '18:00:00'
      before: '08:00:00'
    - condition: template
      value_template: '{{ is_state(''switch.lampada_corredor_socket_1'', ''off'') or
        is_state(''script.campainha_luz_1min'', ''on'') }}'
    then:
    - action: script.turn_on
      target:
        entity_id: script.campainha_luz_1min
  - action: logbook.log
    data:
      name: Sensor Corredor Portão
      message: 'Presença detectada no portão às {{ now().strftime(''%H:%M:%S'') }}'
      entity_id: binary_sensor.sensor_corredor_portao
  mode: queued
  max: 10
- id: '1792500000016'
  alias: Alarme - notificar ativação e desligar lâmpadas em 5 min
  description: Quando o alarme é ativado (armado), envia notificação para os celulares
    informando que está ativo e, após 5 minutos, desliga as lâmpadas da frente e da
    área.
  triggers:
  - trigger: state
    entity_id: alarm_control_panel.alarme_casa
    to:
    - armed_away
    - armed_home
    - armed_night
    - armed_vacation
    - arming
  conditions:
  - condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''triggered'', ''unavailable'', ''unknown''] and (trigger.from_state.state != ''arming'' or trigger.to_state.state != ''armed_away'') }}'
  actions:
  - variables:
      modos:
        armed_home: Em casa
        armed_away: Ausente
        armed_night: Noite
        armed_vacation: Férias
        arming: Ausente
      modo_nome: '{{ modos.get(trigger.to_state.state, trigger.to_state.state) }}'
  - action: notify.celulares
    data:
      title: 🛡️ Alarme ativado ({{ modo_nome }})
      message: 'O alarme foi ativado no modo {{ modo_nome }} às {{ now().strftime(''%H:%M'') }}. As lâmpadas da frente e da área serão desligadas em 5 minutos.'
      data:
        priority: high
        ttl: 0
        channel: alarme
        importance: high
  - action: notify.mobile_app_android_ricardo
    data:
      title: 🛡️ Alarme ativado ({{ modo_nome }})
      message: 'O alarme foi ativado no modo {{ modo_nome }} às {{ now().strftime(''%H:%M'') }}. As lâmpadas da frente e da área serão desligadas em 5 minutos.'
      data:
        priority: high
        ttl: 0
        channel: alarme
        importance: high
  - action: logbook.log
    data:
      name: Alarme casa
      message: 'Alarme ativado ({{ modo_nome }}) — lâmpadas da frente e da área desligam em 5 min'
      entity_id: alarm_control_panel.alarme_casa
  - delay:
      minutes: 5
  - condition: state
    entity_id: alarm_control_panel.alarme_casa
    state:
    - armed_away
    - armed_home
    - armed_night
    - armed_vacation
    - arming
  - action: script.turn_off
    target:
      entity_id:
      - script.campainha_luz_1min
      - script.luz_corredor_10min
  - action: switch.turn_off
    target:
      entity_id: switch.lampada_corredor_socket_1
  - action: light.turn_off
    continue_on_error: true
    target:
      entity_id:
      - light.luz_corredor
      - light.lampada_area_1
      - light.lampada_area_2
  mode: restart

