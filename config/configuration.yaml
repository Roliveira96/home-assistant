
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

http:
  server_port: 9999
  # Required for remote access through the Cloudflare Tunnel (cloudflared
  # runs on the host network, so requests arrive from localhost).
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

template:
  # Zigbee devices whose every entity is unavailable (works for new devices
  # automatically). Used by the "Zigbee indisponível" automation.
  - sensor:
      - name: Zigbee indisponíveis
        unique_id: zigbee_unavailable_devices
        icon: mdi:zigbee
        unit_of_measurement: dispositivos
        state: >
          {% set ns = namespace(n=0) %}
          {% for d in integration_entities('zha') | map('device_id') | reject('none') | unique %}
            {% set st = expand(device_entities(d)) | map(attribute='state') | list %}
            {% if st and st | reject('eq', 'unavailable') | list | count == 0 %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.n }}
        attributes:
          devices: >
            {% set ns = namespace(names=[]) %}
            {% for d in integration_entities('zha') | map('device_id') | reject('none') | unique %}
              {% set st = expand(device_entities(d)) | map(attribute='state') | list %}
              {% if st and st | reject('eq', 'unavailable') | list | count == 0 %}
                {% set ns.names = ns.names + [(device_attr(d, 'name_by_user') or device_attr(d, 'name')) | trim] %}
              {% endif %}
            {% endfor %}
            {{ ns.names }}
      # Sum of today's detections from the three alarm sensors.
      - name: Eventos hoje - Total
        unique_id: events_today_total
        icon: mdi:motion-sensor
        unit_of_measurement: eventos
        state: >
          {{ ['sensor.eventos_hoje_sensor_de_passagem', 'sensor.eventos_hoje_lateral_casa',
              'sensor.eventos_hoje_fundos_casa'] | map('states') | map('int', 0) | sum }}
  # "Detected recently": on while the sensor detects and for the confirmation
  # window after it clears. Used to confirm a human with a second sensor
  # (last_changed alone is not enough: restarts also change it).
  - binary_sensor:
      - name: Detecção recente - Sensor de passagem
        unique_id: recent_detection_passage_sensor
        state: "{{ is_state('binary_sensor.area_externa_sensor_de_passagem_novo', 'on') }}"
        delay_off: "{{ {'minutes': states('input_number.alarme_janela_confirmacao') | int(2)} }}"
      - name: Detecção recente - Lateral casa
        unique_id: recent_detection_side_house
        state: "{{ is_state('binary_sensor.lateral_casa', 'on') }}"
        delay_off: "{{ {'minutes': states('input_number.alarme_janela_confirmacao') | int(2)} }}"
      - name: Detecção recente - Fundos Casa
        unique_id: recent_detection_back_house
        state: "{{ is_state('binary_sensor.fundos_casa', 'on') }}"
        delay_off: "{{ {'minutes': states('input_number.alarme_janela_confirmacao') | int(2)} }}"
  # Log of classified detections while the alarm is armed (last 50, newest
  # first). Trigger-based template entities restore their attributes on restart.
  - triggers:
      - trigger: event
        event_type: alarme_evento
    conditions:
      - condition: template
        value_template: "{{ trigger.event.data.armado | bool(false) }}"
    sensor:
      - name: Registro do alarme armado
        unique_id: armed_alarm_log
        icon: mdi:shield-alert
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          eventos: >
            {% set new = [{'hora': now().strftime('%d/%m %H:%M:%S'),
                           'tipo': trigger.event.data.tipo,
                           'sensores': trigger.event.data.sensores,
                           'foto': trigger.event.data.foto | default('')}] %}
            {{ (new + (this.attributes.eventos | default([], true)))[:50] }}
  # Last doorbell press (fired by the "Campainha - botão" automation).
  - triggers:
      - trigger: event
        event_type: campainha_tocou
    sensor:
      - name: Última campainha
        unique_id: doorbell_last_press
        icon: mdi:doorbell-video
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          tipo: "{{ trigger.event.data.tipo }}"
          luz: "{{ trigger.event.data.luz }}"

zha:
  # Local quirks for devices ZHA does not support out of the box.
  custom_quirks_path: /config/custom_zha_quirks/

alarm_control_panel:
  # Local alarm panel; armed/disarmed from the dashboard or the phone app.
  - platform: manual
    name: Alarme casa
    unique_id: alarme_casa
    code_arm_required: false
    # Exit delay when arming "away"; "home" arms immediately.
    arming_time: 30
    delay_time: 0
    # Stays in "triggered" for 5 min, then goes back to armed.
    trigger_time: 300
    disarm_after_trigger: false
    armed_home:
      arming_time: 0
    # Armed automatically at midnight and disarmed at 07:30 (see automations).
    armed_night:
      arming_time: 0

sensor:
  # Today's detection counts (since midnight) for the alarm dashboard.
  - platform: history_stats
    name: Eventos hoje - Sensor de passagem
    unique_id: events_today_passage_sensor
    entity_id: binary_sensor.area_externa_sensor_de_passagem_novo
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Eventos hoje - Lateral casa
    unique_id: events_today_side_house
    entity_id: binary_sensor.lateral_casa
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Eventos hoje - Fundos Casa
    unique_id: events_today_back_house
    entity_id: binary_sensor.fundos_casa
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Disparos do alarme hoje
    unique_id: alarm_triggers_today
    entity_id: alarm_control_panel.alarme_casa
    state: triggered
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

lovelace:
  dashboards:
    # YAML dashboard, versioned in git (config/dashboards/alarme.yaml).
    dashboard-alarme:
      mode: yaml
      title: Alarme
      icon: mdi:shield-home
      show_in_sidebar: true
      filename: dashboards/alarme.yaml

# Tunable settings for the human/animal classification (shown on the alarm
# dashboard). No "initial" so values set in the UI survive restarts.
input_number:
  alarme_janela_confirmacao:
    name: Janela de confirmação
    icon: mdi:timer-sand
    min: 1
    max: 10
    step: 1
    unit_of_measurement: min
    mode: slider
  alarme_tempo_presenca:
    name: Presença contínua para humano
    icon: mdi:timer-outline
    min: 30
    max: 300
    step: 10
    unit_of_measurement: s
    mode: slider
  alarme_intervalo_aviso_animal:
    name: Intervalo entre avisos de animal
    icon: mdi:bell-sleep
    min: 0
    max: 60
    step: 5
    unit_of_measurement: min
    mode: slider

input_text:
  # "<url path>|<row count>" of the last export (set by alarme_exportar_registro).
  alarme_ultimo_export:
    name: Último download do registro
    max: 255

input_select:
  # Sound played on the notebook for "possível humano" (alarme_som_pessoa).
  alarme_som_pessoa:
    name: Som de pessoa
    icon: mdi:music-note
    options:
      - Ding-dong
      - Mensagem
      - Login
      - Despertador

input_boolean:
  # The radar (Sensor de passagem novo) pulses every ~61 s, so it is "recently
  # detected" almost all the time; while off it does not confirm a human.
  alarme_radar_confirma:
    name: Radar confirma humano
    icon: mdi:radar
  # Plays sounds on the notebook for classified detections while armed.
  alarme_som_notebook:
    name: Som no notebook
    icon: mdi:volume-high

input_datetime:
  # Period for the armed-alarm log download.
  alarme_export_inicio:
    name: Download - início
    has_date: true
    has_time: true
  alarme_export_fim:
    name: Download - fim
    has_date: true
    has_time: true
  alarme_ultimo_aviso_animal:
    name: Último aviso de possível animal
    has_date: true
    has_time: true

counter:
  # Classified detections of the day (reset at midnight by automation).
  eventos_possivel_animal:
    name: Possível animalzinho
    icon: mdi:cat
    restore: true
  eventos_possivel_humano:
    name: Possível humano
    icon: mdi:human-handsdown
    restore: true
  # Doorbell presses of the day (reset at midnight by automation).
  campainha_hoje:
    name: Campainha hoje
    icon: mdi:doorbell
    restore: true

shell_command:
  # Plays a sound file on the notebook speakers through PipeWire.
  # Variables: file (path inside the container), volume (gain; >1 boosts),
  # loops (extra repetitions, played back to back).
  # ffmpeg exits ~1.8 s before playback ends and PipeWire drops what is still
  # buffered, so 3 s of trailing silence makes sure the whole sound is heard.
  # Used by the scripts in scripts.yaml.
  alarme_tocar_som: >-
    ffmpeg -hide_banner -loglevel error
    -stream_loop {{ loops | default(0) | int }}
    -i {{ file | default('/sounds/freedesktop/stereo/bell.oga') }}
    -filter:a volume={{ volume | default(1.0) }},apad=pad_dur=3
    -f pulse "Home Assistant"
  # Armed-alarm CSV history and period export (config/alarme/alarm_log.py).
  alarme_log_append: python3 /config/alarme/alarm_log.py append "{{ tipo }}" "{{ sensores }}"
  alarme_log_export: python3 /config/alarme/alarm_log.py export "{{ start }}" "{{ end }}"
